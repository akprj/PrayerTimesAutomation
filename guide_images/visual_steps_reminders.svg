<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="title desc">
  <title id="title">Set a default prayer reminder on Android or iPhone</title>
  <desc id="desc">Two illustrated phone screens show opening Bait-us-Subuh calendar settings and adding a notification such as 15 minutes before.</desc>
  <g font-family="Arial, sans-serif">
    <rect x="9" y="10" width="405" height="250" rx="19" fill="#eaf7ef" stroke="#72c99d" stroke-width="2"/>
    <rect x="426" y="10" width="405" height="250" rx="19" fill="#edf4ff" stroke="#86b2f3" stroke-width="2"/>
    <circle cx="38" cy="37" r="17" fill="#1e9d69"/><text x="38" y="43" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">A</text>
    <text x="65" y="43" fill="#18563c" font-size="18" font-weight="700">ANDROID · GOOGLE CALENDAR</text>
    <circle cx="455" cy="37" r="17" fill="#3977d4"/><text x="455" y="43" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">i</text>
    <text x="482" y="43" fill="#244e90" font-size="18" font-weight="700">IPHONE · GOOGLE CALENDAR</text>
    <g transform="translate(35 61)">
      <rect width="166" height="171" rx="20" fill="#172a32"/>
      <rect x="7" y="7" width="152" height="157" rx="15" fill="#fff"/>
      <rect x="7" y="7" width="152" height="28" rx="12" fill="#245b4e"/>
      <path d="M20 17h15M20 22h15M20 27h15" stroke="#fff" stroke-width="2"/>
      <text x="42" y="26" fill="#fff" font-size="10" font-weight="700">Calendar settings</text>
      <text x="17" y="55" fill="#536861" font-size="10">MY CALENDARS</text>
      <rect x="15" y="62" width="137" height="28" rx="6" fill="#edf5f1"/>
      <circle cx="27" cy="76" r="6" fill="#2eb47c"/>
      <text x="39" y="80" fill="#1d382e" font-size="10" font-weight="700">Bait-us-Subuh</text>
      <text x="17" y="108" fill="#52665f" font-size="9">Default notifications</text>
      <rect x="15" y="115" width="137" height="32" rx="6" fill="#f2faf6" stroke="#45b785" stroke-width="2"/>
      <path d="M27 126v9M23 132h8" stroke="#20835b" stroke-width="2" stroke-linecap="round"/>
      <text x="39" y="136" fill="#176344" font-size="10" font-weight="700">15 minutes before</text>
      <path d="M184 151c3-17 7-35 8-44 1-7 8-7 9 0l1 17c5-6 12-4 12 3 6-3 12 1 10 8 6 1 7 7 3 12l-10 15c-7 8-22 8-31 0Z" fill="#ffd3a2" stroke="#7d4627" stroke-width="2"/>
      <text x="86" y="190" fill="#176344" font-size="11" font-weight="700" text-anchor="middle">Settings → calendar → alert</text>
    </g>
    <path d="M218 143h32" stroke="#2e9b69" stroke-width="4"/>
    <path d="m248 135 12 8-12 8" fill="none" stroke="#2e9b69" stroke-width="4"/>
    <g transform="translate(273 61)">
      <rect width="166" height="171" rx="20" fill="#172a32"/>
      <rect x="7" y="7" width="152" height="157" rx="15" fill="#fff"/>
      <rect x="7" y="7" width="152" height="28" rx="12" fill="#3972cf"/>
      <text x="19" y="26" fill="#fff" font-size="10" font-weight="700">Calendar settings</text>
      <text x="17" y="55" fill="#536481" font-size="10">CALENDARS</text>
      <rect x="15" y="62" width="137" height="28" rx="6" fill="#edf3fd"/>
      <circle cx="27" cy="76" r="6" fill="#3977d4"/>
      <text x="39" y="80" fill="#243f68" font-size="10" font-weight="700">Bait-us-Subuh</text>
      <text x="17" y="108" fill="#526481" font-size="9">Event notifications</text>
      <rect x="15" y="115" width="137" height="32" rx="6" fill="#f3f7ff" stroke="#6197e6" stroke-width="2"/>
      <path d="M27 126v9M23 132h8" stroke="#3469b6" stroke-width="2" stroke-linecap="round"/>
      <text x="39" y="136" fill="#28569c" font-size="10" font-weight="700">15 minutes before</text>
      <path d="M147 154c3-14 5-23 6-30 1-6 7-6 8 0l1 12c5-4 10-1 9 5 6-1 9 5 5 10l-8 10c-6 6-16 5-21-1Z" fill="#ffd3a2" stroke="#7d4627" stroke-width="2"/>
      <text x="86" y="190" fill="#28569c" font-size="11" font-weight="700" text-anchor="middle">Add notification → choose time</text>
    </g>
    <g transform="translate(472 84)">
      <circle cx="22" cy="22" r="20" fill="#fff" stroke="#83a9e3" stroke-width="2"/>
      <path d="M22 10v12l9 5" fill="none" stroke="#3977d4" stroke-width="3" stroke-linecap="round"/>
      <text x="54" y="19" fill="#244e90" font-size="13" font-weight="700">Pick a lead time</text>
      <text x="54" y="38" fill="#536b90" font-size="12">e.g. 15 minutes before</text>
    </g>
    <text x="613" y="193" fill="#536b90" font-size="12" text-anchor="middle">Allow notifications in phone Settings</text>
  </g>
</svg>
