<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <filter id="shadow-s5" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="0" y="0" width="900" height="240" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow-s5)"/>

  <!-- Step Header -->
  <circle cx="50" cy="42" r="20" fill="#0f172a"/>
  <text x="50" y="49" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="900" text-anchor="middle">5</text>

  <text x="86" y="38" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="800">Device Guide: Android vs Apple iPhone (iOS)</text>
  <text x="86" y="56" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Google Calendar App availability and recommendations by platform</text>

  <line x1="24" y1="72" x2="876" y2="72" stroke="#f1f5f9" stroke-width="2"/>

  <!-- LEFT: Android Card -->
  <g transform="translate(36, 88)">
    <rect x="0" y="0" width="400" height="130" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="18" fill="#10b981"/>
    <text x="34" y="41" fill="#ffffff" font-size="17" text-anchor="middle">🤖</text>

    <text x="64" y="30" fill="#14532d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Android Phones (Samsung, Pixel, Xiaomi...)</text>
    <text x="64" y="46" fill="#15803d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Google Calendar is Pre-Installed by Default</text>

    <text x="18" y="74" fill="#166534" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      ✓ Almost every certified Android phone already has Google Calendar installed.<br>
      ✓ If you uninstalled it: Download it free from the <strong>Google Play Store</strong>.<br>
      ✓ Android allows selecting any custom ringtone or Azaan MP3 file per app!
    </text>
  </g>

  <!-- RIGHT: Apple iPhone Card -->
  <g transform="translate(464, 88)">
    <rect x="0" y="0" width="400" height="130" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <circle cx="34" cy="34" r="18" fill="#3b82f6"/>
    <text x="34" y="41" fill="#ffffff" font-size="17" text-anchor="middle">🍏</text>

    <text x="64" y="30" fill="#1e40af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">Apple iPhone &amp; iPad (iOS)</text>
    <text x="64" y="46" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Download Google Calendar from App Store</text>

    <text x="18" y="74" fill="#1e3a8a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      ✓ iPhones come with Apple Calendar by default.<br>
      ✓ <strong>Recommendation:</strong> Download the free official <strong>Google Calendar app</strong><br>
      &nbsp;&nbsp;&nbsp;from the Apple App Store for dedicated notifications and color-coded events.<br>
      ✓ If using Apple Calendar, you can subscribe, but alerts use system chimes.
    </text>
  </g>
</svg>
