<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" role="img" aria-labelledby="title desc">
  <title id="title">Choose calendar notification sounds on Android and iPhone</title>
  <desc id="desc">Two phones show Android notification sound selection and iPhone Google Calendar notification permission, with a bell and sound waves.</desc>
  <g font-family="Arial, sans-serif">
    <rect x="10" y="10" width="402" height="250" rx="20" fill="#eaf7ef" stroke="#72c99d" stroke-width="2"/>
    <rect x="428" y="10" width="402" height="250" rx="20" fill="#edf4ff" stroke="#86b2f3" stroke-width="2"/>
    <text x="30" y="42" fill="#18563c" font-size="18" font-weight="700">ANDROID · PICK A TONE</text>
    <text x="448" y="42" fill="#244e90" font-size="18" font-weight="700">IPHONE · ALLOW SOUNDS</text>
    <g transform="translate(45 58)">
      <rect width="169" height="166" rx="20" fill="#172a32"/>
      <rect x="7" y="7" width="155" height="152" rx="15" fill="#fff"/>
      <rect x="7" y="7" width="155" height="27" rx="12" fill="#245b4e"/>
      <text x="20" y="25" fill="#fff" font-size="10" font-weight="700">App notifications</text>
      <text x="17" y="52" fill="#66776f" font-size="9">GOOGLE CALENDAR</text>
      <rect x="15" y="59" width="139" height="37" rx="6" fill="#edf5f1" stroke="#c7ddd3"/>
      <text x="24" y="75" fill="#29463a" font-size="10" font-weight="700">Calendar notifications</text>
      <text x="24" y="88" fill="#6e8178" font-size="9">Alert style and sound</text>
      <rect x="15" y="103" width="139" height="39" rx="7" fill="#e5f5ec" stroke="#34a876" stroke-width="2"/>
      <path d="M26 114v10l7 5v-20Z" fill="#25825b"/>
      <path d="M39 116q8 6 0 12M43 112q13 10 0 20" fill="none" stroke="#25825b" stroke-width="2" stroke-linecap="round"/>
      <text x="57" y="119" fill="#18563c" font-size="9" font-weight="700">Sound</text>
      <text x="57" y="133" fill="#18563c" font-size="9">Choose tone / file</text>
      <path d="M169 156c4-17 7-34 9-44 1-7 8-7 9 0l1 17c5-6 12-4 12 3 6-3 12 1 10 8 6 1 7 7 3 12l-10 15c-7 8-22 8-31 0Z" fill="#ffd3a2" stroke="#7d4627" stroke-width="2"/>
      <text x="84" y="188" fill="#176344" font-size="11" font-weight="700" text-anchor="middle">Settings → Apps → Calendar</text>
    </g>
    <g transform="translate(477 58)">
      <rect width="169" height="166" rx="22" fill="#172a32"/>
      <rect x="7" y="7" width="155" height="152" rx="16" fill="#fff"/>
      <rect x="52" y="11" width="65" height="9" rx="5" fill="#172a32"/>
      <text x="18" y="43" fill="#3977d4" font-size="9" font-weight="700">‹ Notifications</text>
      <text x="18" y="62" fill="#263e62" font-size="11" font-weight="700">Google Calendar</text>
      <rect x="15" y="72" width="139" height="38" rx="7" fill="#edf3fd" stroke="#c5d5ef"/>
      <text x="24" y="89" fill="#304d78" font-size="9" font-weight="700">Allow Notifications</text>
      <rect x="118" y="81" width="27" height="16" rx="8" fill="#35b67e"/>
      <circle cx="136" cy="89" r="6" fill="#fff"/>
      <rect x="15" y="118" width="139" height="28" rx="7" fill="#f1f5fc" stroke="#c5d5ef"/>
      <path d="M27 126v9l6 4v-17Z" fill="#3977d4"/>
      <path d="M39 127q7 5 0 10M43 124q11 8 0 16" fill="none" stroke="#3977d4" stroke-width="2" stroke-linecap="round"/>
      <text x="57" y="136" fill="#304d78" font-size="10" font-weight="700">Sounds ON</text>
      <text x="84" y="188" fill="#28569c" font-size="11" font-weight="700" text-anchor="middle">Settings → Notifications</text>
    </g>
    <g transform="translate(690 100)">
      <path d="M29 15c-16 0-25 12-25 27v18L-5 72h68L52 60V42c0-15-9-27-23-27Z" fill="#fff1c7" stroke="#d59a28" stroke-width="4"/>
      <path d="M21 75c2 11 14 11 16 0" fill="#fff1c7" stroke="#d59a28" stroke-width="4"/>
      <path d="M66 31q16 12 0 24M73 23q27 20 0 40" fill="none" stroke="#4094ce" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>
</svg>
