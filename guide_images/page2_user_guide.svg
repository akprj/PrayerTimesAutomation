<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 1350" width="100%" height="100%">
  <defs>
    <filter id="p2Shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="p2HeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2923"/>
      <stop offset="100%" stop-color="#1a4d42"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="950" height="1350" fill="#f8fafc"/>

  <!-- ================= HEADER SECTION ================= -->
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="950" height="140" fill="url(#p2HeaderGrad)"/>
    
    <text x="40" y="46" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Method 1: Set Lifetime Prayer Alarms</text>
    <text x="40" y="74" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">ONE-TIME SETUP FOR ANDROID &amp; APPLE IPHONE (iOS)</text>
    <text x="40" y="100" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">PAGE 2: CONFIGURE DESIRED ALARM TIME BEFORE PRAYERS (LIFETIME RULE)</text>

    <!-- Top Bell Icon -->
    <g transform="translate(800, 24)">
      <circle cx="36" cy="46" r="30" fill="#143e35" stroke="#34d399" stroke-width="2"/>
      <text x="36" y="55" fill="#34d399" font-size="28" text-anchor="middle">🔔</text>
    </g>
  </g>

  <!-- ================= WHY THIS IS NEEDED CARD ================= -->
  <g transform="translate(30, 160)">
    <rect x="0" y="0" width="890" height="90" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#p2Shadow)"/>
    
    <g transform="translate(24, 18)">
      <circle cx="16" cy="16" r="14" fill="#f59e0b"/>
      <text x="16" y="22" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">!</text>
      
      <text x="42" y="14" fill="#92400e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800">
        WHY DO METHOD 1 USERS NEED THIS ONE-TIME SETUP?
      </text>
      <text x="42" y="34" fill="#78350f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
        Modern smartphone privacy &amp; security rules prevent public calendar subscriptions from forcing loud alarms automatically on your phone.
      </text>
      <text x="42" y="52" fill="#b45309" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">
        You set this notification time ONCE in calendar settings: it becomes a lifetime rule for all 5 daily prayers (Fajr to Isha)!
      </text>
    </g>
  </g>

  <!-- ================= SIDE-BY-SIDE SETUP: ANDROID VS IPHONE ================= -->
  <g transform="translate(30, 270)">
    <rect x="0" y="0" width="890" height="930" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#p2Shadow)"/>

    <!-- Left Column: Android Setup -->
    <g transform="translate(24, 24)">
      <rect x="0" y="0" width="405" height="880" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
      
      <circle cx="28" cy="28" r="14" fill="#10b981"/>
      <text x="28" y="34" fill="#ffffff" font-size="14" text-anchor="middle">🤖</text>
      <text x="50" y="28" fill="#14532d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">FOR ANDROID PHONES</text>
      <text x="50" y="46" fill="#15803d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Samsung, Google Pixel, Xiaomi, Motorola etc.</text>

      <!-- Path Badge -->
      <g transform="translate(16, 62)">
        <rect x="0" y="0" width="373" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="10" y="19" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Google Calendar &gt; Menu (☰) &gt; Settings &gt; Bait-us-Subuh</text>
      </g>

      <!-- Android Phone Mockup -->
      <g transform="translate(16, 105)">
        <rect x="0" y="0" width="230" height="260" rx="16" fill="#1e293b"/>
        <rect x="6" y="6" width="218" height="248" rx="12" fill="#ffffff"/>
        
        <!-- App Header -->
        <rect x="6" y="6" width="218" height="34" rx="8" fill="#174e40"/>
        <line x1="18" y1="18" x2="28" y2="18" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <line x1="18" y1="23" x2="28" y2="23" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <line x1="18" y1="28" x2="28" y2="28" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
        <text x="36" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Google Calendar</text>

        <!-- Settings Content -->
        <g transform="translate(14, 52)">
          <text x="0" y="12" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800">CALENDAR SETTINGS</text>
          <text x="0" y="30" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">Bait-us-Subuh Timings</text>

          <rect x="0" y="42" width="190" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
          <text x="8" y="58" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">Default notifications:</text>
          
          <rect x="6" y="66" width="178" height="28" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.4"/>
          <text x="12" y="84" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800">🔔 15 minutes before</text>
          <circle cx="170" cy="80" r="7" fill="#10b981"/>
          <path d="M167 80 L169 82 L173 78" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

          <rect x="0" y="112" width="190" height="30" rx="5" fill="#e2e8f0"/>
          <text x="95" y="131" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">+ Add a notification</text>
        </g>
      </g>

      <!-- Pointing Hand touching Android Setting -->
      <g transform="translate(235, 260)">
        <circle cx="12" cy="18" r="10" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.8"/>
        <path d="M 12,18 C 12,6 15,-6 18,-18 C 19,-22 24,-22 25,-18 C 26,-11 25,12 25,18 C 28,14 33,12 37,14 C 40,15 41,19 39,23 C 43,20 48,19 51,22 C 54,25 53,30 50,33 C 53,32 58,33 59,38 C 60,45 53,53 47,60 C 38,68 28,72 17,70 C 8,68 0,60 2,48 C 3,40 9,33 12,18 Z" 
              fill="#fed7aa" stroke="#7c2d12" stroke-width="2" stroke-linejoin="round"/>
        <ellipse cx="21" cy="-14" rx="2.5" ry="3.5" fill="#ffffff" opacity="0.6"/>
      </g>

      <!-- Android Step-by-Step Instructions -->
      <g transform="translate(16, 385)">
        <text x="0" y="16" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">Step-by-Step for Android:</text>
        <text x="0" y="38" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">1. Open the <strong>Google Calendar app</strong> on your phone.</text>
        <text x="0" y="60" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">2. Tap the <strong>Menu icon (☰)</strong> in the top-left corner.</text>
        <text x="0" y="82" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">3. Scroll to the bottom and tap <strong>Settings (⚙️)</strong>.</text>
        <text x="0" y="104" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">4. Under your calendars, select <strong>"Bait-us-Subuh Timings"</strong>.</text>
        <text x="0" y="126" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">5. Tap <strong>"Add a notification"</strong> under default notifications.</text>
        <text x="0" y="148" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="800">6. Choose your desired time: e.g. 15 minutes before.</text>

        <!-- Result Box -->
        <rect x="0" y="170" width="373" height="60" rx="8" fill="#dcfce7"/>
        <text x="12" y="194" fill="#14532d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">✓ Done! Lifetime alert rule active.</text>
        <text x="12" y="214" fill="#15803d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Google Calendar will now alert you for Fajr, Zuhr, Asr, Maghrib, and Isha!</text>
      </g>
    </g>

    <!-- Right Column: Apple iPhone Setup -->
    <g transform="translate(455, 24)">
      <rect x="0" y="0" width="410" height="880" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      
      <circle cx="28" cy="28" r="14" fill="#3b82f6"/>
      <text x="28" y="34" fill="#ffffff" font-size="14" text-anchor="middle">🍏</text>
      <text x="50" y="28" fill="#1e40af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800">FOR APPLE IPHONE &amp; IPAD (iOS)</text>
      <text x="50" y="46" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">Apple Calendar App or Google Calendar on iOS</text>

      <!-- Path Badge -->
      <g transform="translate(16, 62)">
        <rect x="0" y="0" width="378" height="30" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="10" y="19" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Apple Calendar &gt; "Calendars" &gt; (i) Info &gt; Event Alerts</text>
      </g>

      <!-- iPhone Mockup -->
      <g transform="translate(16, 105)">
        <rect x="0" y="0" width="230" height="260" rx="16" fill="#0f172a"/>
        <rect x="6" y="6" width="218" height="248" rx="12" fill="#f8fafc"/>
        
        <!-- iOS Header -->
        <rect x="6" y="6" width="218" height="34" rx="8" fill="#2563eb"/>
        <text x="16" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Apple Calendar (iOS)</text>

        <!-- Subscribed Calendars list in iOS -->
        <g transform="translate(14, 52)">
          <text x="0" y="12" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800">SUBSCRIBED CALENDARS</text>
          
          <rect x="0" y="22" width="190" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
          <text x="8" y="44" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">Bait-us-Subuh</text>
          <!-- (i) Info Circle -->
          <circle cx="172" cy="43" r="10" fill="#2563eb"/>
          <text x="172" y="48" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">i</text>

          <!-- iOS Alert setting inside info page -->
          <rect x="0" y="74" width="190" height="54" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/>
          <text x="8" y="92" fill="#1e40af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700">Event Alerts:</text>
          <text x="8" y="112" fill="#1d4ed8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">🔔 15 min before</text>
          <!-- Green iOS Toggle -->
          <rect x="150" y="98" width="30" height="18" rx="9" fill="#10b981"/>
          <circle cx="171" cy="107" r="7" fill="#ffffff"/>
        </g>
      </g>

      <!-- Pointing Hand pointing at iOS Info / Alert -->
      <g transform="translate(235, 260)">
        <circle cx="12" cy="18" r="10" fill="none" stroke="#2563eb" stroke-width="2.5" opacity="0.8"/>
        <path d="M 12,18 C 12,6 15,-6 18,-18 C 19,-22 24,-22 25,-18 C 26,-11 25,12 25,18 C 28,14 33,12 37,14 C 40,15 41,19 39,23 C 43,20 48,19 51,22 C 54,25 53,30 50,33 C 53,32 58,33 59,38 C 60,45 53,53 47,60 C 38,68 28,72 17,70 C 8,68 0,60 2,48 C 3,40 9,33 12,18 Z" 
              fill="#fed7aa" stroke="#7c2d12" stroke-width="2" stroke-linejoin="round"/>
        <ellipse cx="21" cy="-14" rx="2.5" ry="3.5" fill="#ffffff" opacity="0.6"/>
      </g>

      <!-- Apple iPhone Step-by-Step Instructions -->
      <g transform="translate(16, 385)">
        <text x="0" y="16" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">In Apple Calendar App (Built-in):</text>
        <text x="0" y="38" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">1. Open the iPhone <strong>Calendar app</strong>.</text>
        <text x="0" y="60" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">2. Tap <strong>"Calendars"</strong> at the bottom center.</text>
        <text x="0" y="82" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">3. Tap the <strong>info button `(i)`</strong> next to "Bait-us-Subuh".</text>
        <text x="0" y="104" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">4. Turn toggle <strong>"Event Alerts" to ON</strong> (15 min before).</text>

        <!-- Google Calendar App on iOS note -->
        <rect x="0" y="125" width="378" height="60" rx="8" fill="#dbeafe"/>
        <text x="12" y="148" fill="#1e40af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">If using Google Calendar App on iPhone:</text>
        <text x="12" y="168" fill="#1e3a8a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Menu (☰) &gt; Settings &gt; Bait-us-Subuh &gt; Add a notification.</text>
      </g>
    </g>
  </g>

  <!-- ================= PAGE 2 FOOTER ================= -->
  <g transform="translate(0, 1315)">
    <rect x="0" y="0" width="950" height="35" fill="#0b1715"/>
    <text x="475" y="22" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      Page 2 of 4: Method 1 Alarms  ·  Turn to Page 3 for Method 2 (Google Login) &amp; Automated Reminders
    </text>
  </g>
</svg>
