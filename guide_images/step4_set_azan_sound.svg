<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <filter id="shadow-s4" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="hand-glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="0" y="0" width="900" height="320" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow-s4)"/>

  <!-- Step Header -->
  <circle cx="50" cy="46" r="22" fill="#0f172a"/>
  <text x="50" y="54" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle">4</text>

  <text x="88" y="42" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Set Your Desired Ringtone or Azaan (Both Methods)</text>
  <text x="88" y="62" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">The app does NOT have built-in audio: you choose your preferred tone in Android Calendar Settings</text>

  <line x1="24" y1="80" x2="876" y2="80" stroke="#f1f5f9" stroke-width="2"/>

  <!-- LEFT: Android Smartphone Settings UI Mockup -->
  <g transform="translate(36, 96)">
    <!-- Smartphone Bezel -->
    <rect x="0" y="0" width="260" height="200" rx="16" fill="#1e293b" filter="url(#shadow-s4)"/>
    <rect x="6" y="6" width="248" height="188" rx="12" fill="#ffffff"/>

    <!-- Settings Header -->
    <rect x="6" y="6" width="248" height="34" rx="10" fill="#334155"/>
    <text x="16" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">⚙️ Calendar Notification Sound</text>

    <!-- Sound Selection List inside phone -->
    <g transform="translate(14, 46)">
      <text x="0" y="10" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="800">SELECT RINGTONE / AUDIO:</text>

      <!-- Option 1: Standard beep (unselected) -->
      <rect x="0" y="18" width="232" height="26" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="16" cy="31" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="30" y="35" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Default notification sound</text>

      <!-- Option 2: Personal Azaan MP3 (SELECTED with green highlight) -->
      <rect x="0" y="48" width="232" height="34" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
      <!-- Radio Button selected -->
      <circle cx="16" cy="65" r="7" fill="#10b981"/>
      <circle cx="16" cy="65" r="3" fill="#ffffff"/>
      <text x="30" y="63" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">🕌 My Azaan (Audio File).mp3</text>
      <text x="30" y="75" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600">Selected calendar reminder sound</text>

      <!-- Option 3: Other chime -->
      <rect x="0" y="86" width="232" height="26" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
      <circle cx="16" cy="99" r="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="30" y="103" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Chime / Bell / Other Ringtone</text>
    </g>
  </g>

  <!-- MIDDLE: Exact Settings Path & Pointing Hand -->
  <g transform="translate(320, 96)">
    <rect x="0" y="0" width="300" height="26" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="10" y="17" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Phone Settings &gt; Apps &gt; Google Calendar &gt; Sound</text>

    <text x="0" y="46" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">1. Open Phone Settings (⚙️) &gt; Apps</text>
    <text x="0" y="66" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">2. Tap "Google Calendar" &gt; "Notifications"</text>
    <text x="0" y="86" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">3. Tap "Sound" and pick your desired tone</text>

    <!-- Pointing Hand pointing directly at sound option -->
    <g transform="translate(140, 90)" filter="url(#hand-glow4)">
      <circle cx="12" cy="18" r="10" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.8"/>
      <path d="M 12,18 C 12,6 15,-6 18,-18 C 19,-22 24,-22 25,-18 C 26,-11 25,12 25,18 C 28,14 33,12 37,14 C 40,15 41,19 39,23 C 43,20 48,19 51,22 C 54,25 53,30 50,33 C 53,32 58,33 59,38 C 60,45 53,53 47,60 C 38,68 28,72 17,70 C 8,68 0,60 2,48 C 3,40 9,33 12,18 Z" 
            fill="#fed7aa" stroke="#7c2d12" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="21" cy="-14" rx="2.5" ry="3.5" fill="#ffffff" opacity="0.6"/>
    </g>

    <g transform="translate(0, 140)">
      <rect x="0" y="0" width="300" height="48" rx="6" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
      <text x="10" y="18" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800">APPLIES TO BOTH METHODS:</text>
      <text x="10" y="34" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Whether Method 1 or 2, this sets the audio sound that plays.</text>
    </g>
  </g>

  <!-- RIGHT: Essential Clarification & How to add Azaan MP3 -->
  <g transform="translate(640, 96)">
    <rect x="0" y="0" width="230" height="200" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>

    <!-- Clear disclaimer -->
    <g transform="translate(14, 18)">
      <circle cx="10" cy="10" r="10" fill="#f59e0b"/>
      <text x="10" y="15" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="900" text-anchor="middle">!</text>
      <text x="26" y="15" fill="#92400e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">No Built-in Azan Sound</text>
    </g>

    <text x="14" y="48" fill="#78350f" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">
      The automation app syncs calendar events only. It does not play or include audio.
    </text>

    <!-- How to use own Azaan MP3 -->
    <rect x="10" y="70" width="210" height="116" rx="8" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="18" y="88" fill="#92400e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="800">HOW TO USE AN AZAN MP3:</text>
    <text x="18" y="104" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">1. Download your Azan MP3 file.</text>
    <text x="18" y="118" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">2. Move it to the phone folder:</text>

    <rect x="18" y="122" width="180" height="20" rx="4" fill="#fef3c7"/>
    <text x="24" y="136" fill="#92400e" font-family="monospace" font-size="10" font-weight="800">📁 "Notifications"</text>

    <text x="18" y="156" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700">3. It appears in the Sound list!</text>
    <text x="18" y="170" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5">(Or pick any phone chime you like)</text>
  </g>
</svg>
