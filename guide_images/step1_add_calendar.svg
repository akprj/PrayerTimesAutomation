<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <filter id="shadow-s1" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="hand-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="0" y="0" width="900" height="320" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow-s1)"/>

  <!-- Step Header -->
  <circle cx="50" cy="46" r="22" fill="#0f172a"/>
  <text x="50" y="54" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle">1</text>

  <text x="88" y="42" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Add Prayer Times to Calendar (Main Method)</text>
  <text x="88" y="62" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Method 1: Scan QR Code with Camera OR Click the Direct Button (100% Anonymous · No Login)</text>

  <line x1="24" y1="80" x2="876" y2="80" stroke="#f1f5f9" stroke-width="2"/>

  <!-- LEFT: Option A - Phone Camera Scanning QR Code -->
  <g transform="translate(36, 100)">
    <!-- QR Card -->
    <rect x="0" y="0" width="150" height="180" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="75" y="24" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle">OPTION A: SCAN QR</text>

    <!-- QR Code Graphic -->
    <g transform="translate(25, 34)">
      <rect x="0" y="0" width="100" height="100" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Corner Position Squares -->
      <rect x="8" y="8" width="24" height="24" fill="#0f172a" rx="2"/>
      <rect x="12" y="12" width="16" height="16" fill="#ffffff"/>
      <rect x="15" y="15" width="10" height="10" fill="#0f172a"/>

      <rect x="68" y="8" width="24" height="24" fill="#0f172a" rx="2"/>
      <rect x="72" y="12" width="16" height="16" fill="#ffffff"/>
      <rect x="75" y="15" width="10" height="10" fill="#0f172a"/>

      <rect x="8" y="68" width="24" height="24" fill="#0f172a" rx="2"/>
      <rect x="12" y="72" width="16" height="16" fill="#ffffff"/>
      <rect x="15" y="75" width="10" height="10" fill="#0f172a"/>

      <!-- QR Pattern Elements -->
      <rect x="40" y="12" width="8" height="8" fill="#0f172a"/>
      <rect x="52" y="20" width="8" height="8" fill="#0f172a"/>
      <rect x="36" y="36" width="12" height="12" fill="#10b981" rx="2"/>
      <rect x="52" y="44" width="20" height="8" fill="#0f172a"/>
      <rect x="40" y="68" width="16" height="8" fill="#0f172a"/>
      <rect x="68" y="68" width="12" height="12" fill="#0f172a"/>

      <!-- Viewfinder Brackets -->
      <path d="M -6,14 L -6,-6 L 14,-6" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <path d="M 106,14 L 106,-6 L 86,-6" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <path d="M -6,86 L -6,106 L 14,106" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <path d="M 106,86 L 106,106 L 86,106" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    </g>

    <text x="75" y="154" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Point Camera at QR</text>
    <text x="75" y="168" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" text-anchor="middle">On poster, flyer or screen</text>
  </g>

  <!-- MIDDLE: Option B - Click "Add Directly" Button with Hand -->
  <g transform="translate(210, 100)">
    <rect x="0" y="0" width="370" height="180" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="18" y="24" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">OPTION B: CLICK BUTTON DIRECTLY ON YOUR PHONE</text>

    <!-- Website Button Mockup -->
    <g transform="translate(18, 36)">
      <rect x="0" y="0" width="334" height="52" rx="10" fill="#174e40" filter="url(#shadow-s1)"/>
      <circle cx="26" cy="26" r="14" fill="#10b981"/>
      <path d="M20 26 L24 30 L32 21" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="25" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800">Click to Add without SCAN directly</text>
      <text x="48" y="41" fill="#a7f3d0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Direkt ohne Scan zum Kalender hinzufügen</text>
    </g>

    <!-- Tap confirmation prompt mockup -->
    <g transform="translate(18, 98)">
      <rect x="0" y="0" width="220" height="66" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
      <text x="12" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="700">GOOGLE CALENDAR PROMPT</text>
      <text x="12" y="32" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">Add 'Bait-us-Subuh Timings'?</text>
      
      <!-- Add Button inside prompt -->
      <rect x="140" y="38" width="68" height="22" rx="4" fill="#10b981"/>
      <text x="174" y="53" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" text-anchor="middle">Add ✓</text>
    </g>

    <!-- Illustrated Hand with Index Finger Pointing to Add Button -->
    <g transform="translate(230, 94)" filter="url(#hand-glow)">
      <!-- Tap Ripple -->
      <circle cx="12" cy="18" r="10" fill="none" stroke="#10b981" stroke-width="2.5" opacity="0.8"/>
      <circle cx="12" cy="18" r="16" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.4"/>
      <!-- Realistic Cartoon Hand -->
      <path d="M 12,18 C 12,6 15,-6 18,-18 C 19,-22 24,-22 25,-18 C 26,-11 25,12 25,18 C 28,14 33,12 37,14 C 40,15 41,19 39,23 C 43,20 48,19 51,22 C 54,25 53,30 50,33 C 53,32 58,33 59,38 C 60,45 53,53 47,60 C 38,68 28,72 17,70 C 8,68 0,60 2,48 C 3,40 9,33 12,18 Z" 
            fill="#fed7aa" stroke="#7c2d12" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="21" cy="-14" rx="2.5" ry="3.5" fill="#ffffff" opacity="0.6"/>
    </g>
  </g>

  <!-- RIGHT: Key Benefits & Features Card -->
  <g transform="translate(605, 100)">
    <rect x="0" y="0" width="265" height="180" rx="14" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="18" y="26" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800">METHOD 1 KEY FACTS</text>

    <g transform="translate(18, 42)">
      <circle cx="8" cy="8" r="7" fill="#10b981"/>
      <path d="M5 8 L7 10 L11 6" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="22" y="12" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">100% Anonymous Feed</text>
      <text x="22" y="24" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">No login or password needed</text>
    </g>

    <g transform="translate(18, 76)">
      <circle cx="8" cy="8" r="7" fill="#10b981"/>
      <path d="M5 8 L7 10 L11 6" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
      <text x="22" y="12" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Zero Permissions Asked</text>
      <text x="22" y="24" fill="#047857" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Does not access personal data</text>
    </g>

    <g transform="translate(18, 110)">
      <circle cx="8" cy="8" r="7" fill="#3b82f6"/>
      <path d="M5 8 C5 5, 11 5, 11 8 C11 11, 5 11, 5 8" fill="none" stroke="#ffffff" stroke-width="1.5"/>
      <text x="22" y="12" fill="#1e40af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">Weekly Auto-Sync</text>
      <text x="22" y="24" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">New times appear automatically</text>
    </g>

    <rect x="14" y="142" width="237" height="26" rx="6" fill="#d1fae5"/>
    <text x="132" y="159" fill="#065f46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Instant 5-second setup!</text>
  </g>
</svg>
