<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <filter id="shadow-s3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <filter id="hand-glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect x="0" y="0" width="900" height="320" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow-s3)"/>

  <!-- Step Header -->
  <circle cx="50" cy="46" r="22" fill="#0f172a"/>
  <text x="50" y="54" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle">3</text>

  <text x="88" y="42" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">Alternative: Google Account Login (Method 2)</text>
  <text x="88" y="62" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="600">Connect via OAuth 2.0: Event reminders and notifications are created AUTOMATICALLY</text>

  <line x1="24" y1="80" x2="876" y2="80" stroke="#f1f5f9" stroke-width="2"/>

  <!-- LEFT: Button Mockup & Pointing Hand -->
  <g transform="translate(36, 100)">
    <rect x="0" y="0" width="370" height="180" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="18" y="24" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800">CLICK THE GOOGLE LOGIN BUTTON ON THE WEBSITE:</text>

    <!-- Google Button -->
    <g transform="translate(18, 38)">
      <rect x="0" y="0" width="334" height="54" rx="10" fill="#4285f4" filter="url(#shadow-s3)"/>
      <circle cx="28" cy="27" r="14" fill="#ffffff"/>
      <!-- Google 'G' -->
      <text x="28" y="32" fill="#4285f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" text-anchor="middle">G</text>
      <text x="54" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="800">Add Prayer Times via Google Login</text>
      <text x="54" y="42" fill="#dbeafe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600">Sign in with your Google Account (OAuth 2.0)</text>
    </g>

    <!-- Pointing Hand touching Google Button -->
    <g transform="translate(260, 48)" filter="url(#hand-glow3)">
      <circle cx="12" cy="18" r="10" fill="none" stroke="#4285f4" stroke-width="2.5" opacity="0.8"/>
      <circle cx="12" cy="18" r="16" fill="none" stroke="#4285f4" stroke-width="1.5" opacity="0.4"/>
      <path d="M 12,18 C 12,6 15,-6 18,-18 C 19,-22 24,-22 25,-18 C 26,-11 25,12 25,18 C 28,14 33,12 37,14 C 40,15 41,19 39,23 C 43,20 48,19 51,22 C 54,25 53,30 50,33 C 53,32 58,33 59,38 C 60,45 53,53 47,60 C 38,68 28,72 17,70 C 8,68 0,60 2,48 C 3,40 9,33 12,18 Z" 
            fill="#fed7aa" stroke="#7c2d12" stroke-width="2" stroke-linejoin="round"/>
      <ellipse cx="21" cy="-14" rx="2.5" ry="3.5" fill="#ffffff" opacity="0.6"/>
    </g>

    <g transform="translate(18, 108)">
      <text x="0" y="16" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700">1. Sign in securely on Google's consent screen</text>
      <text x="0" y="34" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">2. Grant permission to add events to your calendar</text>
      <text x="0" y="52" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">🔒 Your password is never shared with this app</text>
    </g>
  </g>

  <!-- MIDDLE: Key Difference in Alarms -->
  <g transform="translate(430, 100)">
    <rect x="0" y="0" width="434" height="180" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>

    <g transform="translate(20, 24)">
      <circle cx="14" cy="14" r="14" fill="#3b82f6"/>
      <text x="14" y="20" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" text-anchor="middle">🤖</text>
      <text x="38" y="20" fill="#1e40af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800">AUTOMATED ALARM INJECTION</text>
    </g>

    <text x="20" y="66" fill="#1e3a8a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700">
      How notification alarms work in Method 2:
    </text>

    <g transform="translate(20, 78)">
      <rect x="0" y="0" width="394" height="42" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <text x="12" y="18" fill="#1e40af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800">No manual calendar settings required!</text>
      <text x="12" y="32" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">The backend sync engine attaches notification popups directly to each event payload.</text>
    </g>

    <text x="20" y="142" fill="#1e3a8a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">
      • Your phone rings automatically for every prayer without adjusting calendar rules.<br>
      • To customize the ringtone sound (e.g. choose an Azaan MP3), see Step 4!
    </text>

    <rect x="20" y="152" width="394" height="20" rx="4" fill="#dbeafe"/>
    <text x="217" y="166" fill="#1e40af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Best if you prefer ready-to-use automatic alerts without manual steps.</text>
  </g>
</svg>
