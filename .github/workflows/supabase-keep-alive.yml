name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (e.g., Monday, Thursday, Sunday)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to manually click "Run workflow" anytime

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.GH_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.GH_SUPABASE_KEY }}
        run: |
          echo "Sending Keep-Alive ping to Supabase..."
          
          # Clean up any accidental leading/trailing spaces from secrets
          URL=$(echo "$SUPABASE_URL" | xargs)
          KEY=$(echo "$SUPABASE_ANON_KEY" | xargs)
          
          # Appending /rest/v1/ to make sure it hits the API root directly
          # Sending the key in both the apikey header and Authorization header
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "$URL/rest/v1/" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")

          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 404 ]; then
            echo "Success! Database is awake. HTTP Status: $RESPONSE"
          else
            echo "Error: Ping failed with HTTP Status: $RESPONSE"
            exit 1
          fi
