name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs at 00:00 UTC every 3 days (e.g., Monday, Thursday, Sunday)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to manually click "Run workflow" anytime

jobs:
  ping-db:
    runs-on: ubuntu-24.04 # Pinning to Ubuntu 24.04 avoids the environment migration warnings
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.GH_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.GH_SUPABASE_KEY }}
        run: |
          echo "Sending true Database Keep-Alive ping to Supabase..."
          
          # Clean up any accidental leading/trailing spaces from secrets
          URL=$(echo "$SUPABASE_URL" | xargs | sed 's/\/$//')
          KEY=$(echo "$SUPABASE_ANON_KEY" | xargs)
          
          # Appending an empty rpc target list forces PostgREST to establish
          # an authenticated handshake directly with the Postgres connection pool.
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET "$URL/rest/v1/?select=*" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")

          # An authenticated check returns HTTP 200 (Success)
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "Success! The actual database engine processed the request. HTTP Status: $STATUS_CODE"
          else
            echo "Error: Database ping failed with HTTP Status: $STATUS_CODE"
            exit 1
          fi

